<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 115" width="100%" height="100%">
  <defs>
    <!-- Bar 1 Gradient (Lighter/Cyan Blue) -->
    <linearGradient id="sbBar1Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Bar 2 Gradient (Royal/Indigo Blue) -->
    <linearGradient id="sbBar2Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Bar 3 Gradient (Greenish Teal) -->
    <linearGradient id="sbBar3Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Rising Line Gradient (Purple to Teal/Green) -->
    <linearGradient id="sbLineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="45%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- ==================== CENTRED ICON (X: ~50 to 110) ==================== -->
  <g id="sidebar-icon" transform="translate(54, 4)">
    <!-- Base Page Curves (Subtle Book Horizon at bottom) -->
    <path d="M 4,46 C 16,42 27,43 31,46 C 35,43 46,42 58,46" fill="none" stroke="#CBD5E1" stroke-width="2.2" stroke-linecap="round" />

    <!-- Bar 1 (Shortest / Left) -->
    <path d="M 12,44.5 L 12,27 C 12,24.5 14,23 16.5,23 L 19,23 C 21.5,23 23.5,24.5 23.5,27 L 23.5,44 Z" fill="url(#sbBar1Grad)" />

    <!-- Bar 2 (Medium / Center) -->
    <path d="M 23,43 L 23,19.5 C 23,17 25,15 28,15 L 30.5,15 C 33,15 35,17 35,19.5 L 35,43 Z" fill="url(#sbBar2Grad)" />

    <!-- Bar 3 (Tallest / Right) -->
    <rect x="35" y="9.5" width="10" height="34" rx="0.5" fill="url(#sbBar3Grad)" />

    <!-- Mortarboard Cap (Hovering on the tallest right bar) -->
    <!-- Cap Diamond/Roof -->
    <polygon points="43,0.5 56,4.5 43,8.5 30,4.5" fill="#1E293B" />
    <!-- Cap Edge Shadow -->
    <polygon points="43,8.5 56,4.5 56,6 43,10 30,6 30,4.5 Z" fill="#0F172A" />
    <!-- Yellow/Orange Tassel -->
    <path d="M 42,4 C 53.5,5.5 55.5,11 55,13.5" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="55" cy="14" r="1.2" fill="#F59E0B" />

    <!-- Climbing Trend Line -->
    <path d="M 7,39 L 17,29.5 L 28,21.5 L 40,15 L 48.5,7" fill="none" stroke="url(#sbLineGrad)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Top Landmark Achievement Node -->
    <circle cx="49.5" cy="6" r="3.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.6" />
  </g>

  <!-- ==================== STACKED TYPOGRAPHY (X: ~0 to 170) ==================== -->
  <g id="sidebar-text" transform="translate(0, 56)">
    <!-- Main stacked logo name "Edumetrics" (Reduced horizontally, oversized, centered) -->
    <text x="85" y="24" text-anchor="middle" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, &#39;Inter&#39;, sans-serif" font-size="25" font-weight="900" letter-spacing="-0.8">
      <tspan fill="#0F172A">Edu</tspan><tspan fill="#2563EB">metrics</tspan>
    </text>

    <!-- DASHBOARD badge (Centered underneath to protect X overflow) -->
    <g transform="translate(85, 41)">
      <!-- Centralised box container -->
      <rect x="-42" y="-11" width="84" height="15" rx="3.5" fill="#EFF6FF" />
      <text x="0" y="0" text-anchor="middle" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, &#39;Inter&#39;, sans-serif" font-size="8.5" font-weight="800" letter-spacing="0.6" fill="#1E40AF">DASHBOARD</text>
            
      <!-- Miniature status dot tucked into the badge line -->
      <circle cx="48" cy="-3.5" r="2.5" fill="#10B981" />
    </g>
  </g>
</svg>